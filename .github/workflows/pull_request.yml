name: Build and Test

on: pull_request

permissions:
  contents: read

jobs:
  lint:
    if: github.repository == 'ml-explore/mlx-swift'
    runs-on: ubuntu-latest
    container:
      image: swift:6.2-rhel-ubi9
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Setup uv
        uses: astral-sh/setup-uv@v6
        with:
          activate-environment: true

      - name: Setup pre-commit
        shell: sh
        run: |
          uv pip install pre-commit

      - name: Get swift-format tag
        id: swift-format
        shell: sh
        run: |
          cd /tmp
          LATEST_TAG=$(curl -s https://api.github.com/repos/swiftlang/swift-format/releases/latest | \
            grep '"tag_name":' | \
            sed -E 's/.*"([^"]+)".*/\1/')
          echo "swift-format $LATEST_TAG"
          echo "SWIFT_FORMAT_VERSION=$LATEST_TAG" >> $GITHUB_OUTPUT

      - name: Cache swift-format build
        uses: actions/cache@v4
        id: cache-swift-format
        with:
          path: /tmp/swift-format/.build
          key: ${{ runner.os }}-swift-format-build-${{ steps.swift-format.outputs.SWIFT_FORMAT_VERSION }}

      - name: Build swift-format
        if: steps.cache-swift-format.outputs.cache-hit != 'true'
        shell: sh
        run: |
          cd /tmp
          git clone --branch ${{ steps.swift-format.outputs.SWIFT_FORMAT_VERSION }} --depth 1 https://github.com/swiftlang/swift-format.git
          cd swift-format
          swift build -c release

      - name: Link swift-format to /usr/local/bin
        shell: sh
        run: |
          cd /tmp/swift-format
          ln -s "$(swift build --show-bin-path -c release)/swift-format" /usr/local/bin/swift-format

      - name: Configure safe directory for git
        shell: sh
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Run style checks
        shell: sh
        run: |
          pre-commit run --all || (echo "Style checks failed, please install pre-commit and run pre-commit run --all and push the change"; echo ""; git --no-pager diff; exit 1)

  mac_build_and_test:
    needs: lint
    if: github.repository == 'ml-explore/mlx-swift'
    runs-on: [self-hosted, macos]
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Verify MetalToolchain installed
        shell: bash
        run: xcodebuild -showComponent MetalToolchain

      - name: Setup cmake
        shell: sh
        run: |
          brew install cmake ninja

      - name: Build SwiftPM (Xcode, macOS)
        shell: sh
        env:
          # workaround for CI failure
          DEVELOPER_DIR: /Applications/Xcode-latest.app
        run: |
          xcodebuild -version
          xcrun --show-sdk-build-version
          swift --version
          rm -rf ~/Library/Developer/Xcode/DerivedData/*
          xcodebuild build-for-testing -scheme mlx-swift-Package -destination 'platform=macOS'

      - name: Run Tests SwiftPM (Xcode, macOS)
        shell: sh
        env:
          # workaround for CI failure
          DEVELOPER_DIR: /Applications/Xcode-latest.app
        run: |
          xcrun xctest ~/Library/Developer/Xcode/DerivedData/mlx-swift-*/Build/Products/Debug/CmlxTests.xctest
          xcrun xctest ~/Library/Developer/Xcode/DerivedData/mlx-swift-*/Build/Products/Debug/MLXTests.xctest

      - name: Build xcodeproj (Xcode, macOS)
        shell: sh
        env:
          # workaround for CI failure
          DEVELOPER_DIR: /Applications/Xcode-latest.app
        run: |
          rm -rf ~/Library/Developer/Xcode/DerivedData/*
          cd xcode
          xcodebuild build-for-testing -scheme MLX -destination 'platform=macOS'

      - name: Run Tests xcodeproj (Xcode, macOS)
        env:
          # workaround for CI failure
          DEVELOPER_DIR: /Applications/Xcode-latest.app
        working-directory: xcode
        run: |
          BUILD_DIR="$(xcodebuild -configuration Debug -showBuildSettings -scheme MLX | grep 'BUILT_PRODUCTS_DIR = /' | sed -e 's/^[^=]*= //g' | head -1)"
          # rpath points to PackageFrameworks, so link it to the built products.
          (cd "$BUILD_DIR/PackageFrameworks"; ln -s ../*.framework .)
          xcrun xctest "$BUILD_DIR/MLXTests.xctest"

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            ~/Library/Developer/Xcode/DerivedData/**/Logs/Test/*.xcresult
            /Users/runner/Library/Developer/Xcode/DerivedData/**/Logs/Test/*.xcresult
            ~/Library/Logs/DiagnosticReports/*
          retention-days: 7

      - name: Build (cmake)
        shell: sh
        run: |
          rm -rf build
          mkdir build
          cd build
          cmake .. -G Ninja
          ninja

  linux_build_cmake_container:
    name: Linux Container CMake Swift Build (${{ matrix.container }} ${{ matrix.arch }})
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        include:
          # See https://github.com/swiftlang/swift-docker/tree/main/
          - host: ubuntu-22.04
            arch: x86_64
            container: swift:bookworm
          - host: ubuntu-22.04
            arch: x86_64
            container: swift:fedora39
          - host: ubuntu-22.04-arm
            arch: aarch64
            container: swift:bookworm
          - host: ubuntu-22.04-arm
            arch: aarch64
            container: swift:fedora39

    runs-on: ${{ matrix.host }}
    container:
      image: ${{ matrix.container }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Linux Container CMake Swift Build - No Release
        run: |
          set -ex
          if command -v apt-get >/dev/null 2>&1; then
            apt-get update -y
            apt-get install -y \
              build-essential \
              cmake \
              ninja-build \
              libblas-dev \
              liblapacke-dev \
              libopenblas-dev
          elif command -v dnf >/dev/null 2>&1; then
            dnf update -y
            dnf install -y \
              blas-devel \
              lapack-devel \
              openblas-devel \
              make \
              cmake \
              clang \
              ninja-build
          else
            echo "No supported package manager found (apt-get, dnf)"
            exit 1
          fi

          # CI build sanity check: verify compilation, not a release build.
          export CMAKE_ARGS="-DCMAKE_COMPILE_WARNING_AS_ERROR=ON"
          export DEBUG=1
          export CMAKE_C_COMPILER=/usr/bin/clang
          export CMAKE_CXX_COMPILER=/usr/bin/clang++
          rm -rf build
          mkdir -p build
          pushd build
          cmake -DMLX_BUILD_METAL=OFF .. -G Ninja
          ninja
          ./example1
          ./tutorial
          popd

  linux_build_cmake_cuda:
    name: Linux CUDA CMake Swift Build (cuda-12.9, swift-6.2.3-RELEASE, ubuntu-24.04, x86_64)
    needs: lint
    runs-on: "gpu-t4-4-core"
    env:
      # Note 12/18/2025: the CI machine does not meet CUDA 13's driver requirement.
      # Compatibility matrix:
      # https://docs.nvidia.com/deeplearning/cudnn/backend/latest/reference/support-matrix.html
      TOOLKIT_VERSION: "cuda-12.9"
      SWIFT_VERSION: "swift-6.2.3-RELEASE"
      # pub   rsa4096 2024-09-16 [SC] [expires: 2026-09-16]
      #      52BB7E3DE28A71BE22EC05FFEF80A866B47A981F
      # uid           [ unknown] Swift 6.x Release Signing Key <swift-infrastructure@forums.swift.org>
      SWIFT_SIGNING_KEY: "52BB7E3DE28A71BE22EC05FFEF80A866B47A981F"
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Linux CUDA Setup
        run: |
          set -ex
          : "${TOOLKIT_VERSION:?Error: TOOLKIT_VERSION is not set. Please define it in the GitHub Actions workflow.}"
          : "${SWIFT_VERSION:?Error: SWIFT_VERSION is not set. Please define it in the GitHub Actions workflow.}"
          : "${SWIFT_SIGNING_KEY:?Error: SWIFT_SIGNING_KEY is not set. Please define it in the GitHub Actions workflow.}"

          if [[ "$(uname -s)" != "Linux" ]]; then
            echo "Error: This setup is intended for Linux only."
            echo "Detected OS: $(uname -s)"
            exit 1
          fi
          export ARCH="$(uname -m)"
          if [[ "$ARCH" != "x86_64" ]]; then
            echo "Error: This setup is intended for x86_64 only."
            echo "Detected arch: $(uname -m)"
            exit 1
          fi
          ID="$(grep '^ID=' /etc/os-release | cut -d'=' -f2 || true)"
          VERSION_ID="$(grep '^VERSION_ID=' /etc/os-release | cut -d'=' -f2 | tr -d '"' || true)"
          if [[ "$ID" != "ubuntu" || "$VERSION_ID" != "24.04" ]]; then
            PRETTY_NAME="$(grep '^PRETTY_NAME=' /etc/os-release | cut -d'=' -f2 | tr -d '"' || true)"
            echo "Error: This setup is intended for Ubuntu 24.04 only."
            echo "Detected OS: ${PRETTY_NAME:-"Unknown Linux"}"
            exit 1
          fi
          SWIFT_PLATFORM=ubuntu24.04

          export DEBIAN_FRONTEND=noninteractive
          sudo apt-get update
          sudo apt-get install -y \
            binutils \
            build-essential \
            cmake \
            curl \
            dkms \
            git \
            gnupg2 \
            libblas-dev \
            libc6-dev \
            libcurl4-openssl-dev \
            libedit2 \
            libgcc-13-dev \
            liblapacke-dev \
            libncurses-dev \
            libopenblas-dev \
            libpython3-dev \
            libsqlite3-0 \
            libstdc++-13-dev \
            libxml2-dev \
            libz3-dev \
            ninja-build \
            pkg-config \
            python3-lldb \
            tzdata \
            ubuntu-drivers-common \
            unzip \
            zip \
            zlib1g-dev

          sudo apt-get install -y \
            openmpi-bin \
            openmpi-common \
            libopenmpi-dev

          CUDA_MAJOR_VERSION="${TOOLKIT_VERSION%.*}"
          CUDA_TOOLKIT_PKG="cuda-toolkit-${TOOLKIT_VERSION#cuda-}"
          CUDNN_PKG="libcudnn9-dev-${CUDA_MAJOR_VERSION}"
          CUDA_PACKAGES="$CUDNN_PKG $CUDA_TOOLKIT_PKG"
          wget "https://developer.download.nvidia.com/compute/cuda/repos/ubuntu2204/$ARCH/cuda-keyring_1.1-1_all.deb"
          sudo dpkg -i cuda-keyring_1.1-1_all.deb
          sudo apt-get update
          sudo apt-get install -y \
            libnccl2 \
            libnccl-dev \
            $CUDA_PACKAGES
          CUDA_BIN_PATH="/usr/local/${TOOLKIT_VERSION}/bin"
          export PATH="$CUDA_BIN_PATH:$PATH"
          rm cuda-keyring_1.1-1_all.deb

          echo "NVIDIA Driver Packages Available:"
          sudo ubuntu-drivers list --gpgpu
          echo "NVIDIA Driver Version:"
          cat /proc/driver/nvidia/version || echo "nvidia driver not found"
          echo "Installed NVIDIA and CUDA packages:"
          dpkg -l | egrep "cuda|nvidia" -i
          echo "DKMS Status:"
          dkms status || echo "dkms not found"
          echo "NVIDIA-SMI Status:"
          nvidia-smi || echo "nvidia-smi not found"

          SWIFT_WEBROOT="https://download.swift.org"
          case "$ARCH" in
            x86_64)
              OS_ARCH_SUFFIX=""
              ;;
            aarch64|arm64)
              OS_ARCH_SUFFIX="-aarch64"
              ;;
            *)
              echo "Error: Unsupported architecture: ${ARCH}" >&2
              exit 1
              ;;
          esac
          SWIFT_BRANCH="$(echo "$SWIFT_VERSION" | tr '[:upper:]' '[:lower:]')"
          SWIFT_WEBDIR="$SWIFT_WEBROOT/$SWIFT_BRANCH/$(echo "$SWIFT_PLATFORM" | tr -d .)$OS_ARCH_SUFFIX"
          SWIFT_BIN_URL="$SWIFT_WEBDIR/$SWIFT_VERSION/$SWIFT_VERSION-$SWIFT_PLATFORM$OS_ARCH_SUFFIX.tar.gz"
          SWIFT_SIG_URL="$SWIFT_BIN_URL.sig"
          GNUPGHOME="$(mktemp -d)"
          export GNUPGHOME
          curl -fsSL "$SWIFT_BIN_URL" -o swift.tar.gz "$SWIFT_SIG_URL" -o swift.tar.gz.sig
          gpg --batch --quiet --keyserver keyserver.ubuntu.com --recv-keys "$SWIFT_SIGNING_KEY"
          gpg --batch --verify swift.tar.gz.sig swift.tar.gz
          sudo tar -xzf swift.tar.gz --directory / --strip-components=1
          sudo chmod -R o+r /usr/lib/swift
          rm -rf "$GNUPGHOME" swift.tar.gz.sig swift.tar.gz
          swift --version

      - name: Linux CUDA CMake Swift Build - No Release
        run: |
          set -ex
          : "${TOOLKIT_VERSION:?Error: TOOLKIT_VERSION is not set. Please define it in the GitHub Actions workflow.}"
          CUDA_BIN_PATH="/usr/local/${TOOLKIT_VERSION}/bin"
          export PATH="$CUDA_BIN_PATH:$PATH"

          # CI build sanity check: verify compilation, not a release build.
          export CMAKE_ARGS="-DCMAKE_COMPILE_WARNING_AS_ERROR=ON"
          export DEBUG=1
          export CMAKE_C_COMPILER=/usr/bin/clang
          export CMAKE_CXX_COMPILER=/usr/bin/clang++
          rm -rf build
          mkdir -p build
          pushd build
          cmake -DMLX_BUILD_METAL=OFF -DMLX_BUILD_CUDA=ON -DMLX_C_BUILD_EXAMPLES=OFF .. -G Ninja
          ninja
          ./example1 --device gpu
          ./tutorial --device gpu
          popd
